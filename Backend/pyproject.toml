[project]
name = "masterball-backend"
version = "0.1.0"
description = "Master Ball backend — FastAPI service for the Pokedex/Team Builder/Calculator and the AI agent layer on top."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "arq>=0.26.3",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.0",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.2.7",
    "langchain-openai>=1.3.3",
    "langfuse>=4.14.0",
    "langgraph>=1.2.2",
    "llama-index-core>=0.14.23",
    "mcp>=1.0.0",
    "neo4j>=5.28.0",
    "numpy>=2.5.1",
    "pgvector>=0.5.0",
    "poke-env>=0.15.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pywebpush>=2.3.0",
    "scikit-learn>=1.9.0",
    "sentry-sdk>=2.64.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    # Pinned below 0.4.0 to work around a real ragas==0.3.2 bug: it
    # unconditionally imports `langchain_community.chat_models.vertexai`,
    # which newer langchain-community releases removed — `import ragas`
    # crashes outright without this pin. Safe to drop once ragas ships a fix
    # for https://github.com/vibrantlabsai/ragas/issues/2753 (or a similar
    # issue) and this repo bumps past it. See Backend/eval/README.md.
    "langchain-community<0.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "ragas>=0.3.2",
    "rapidfuzz>=3.14.5",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` as an argument default is the framework's own
# documented dependency-injection pattern, not the mutable-default-argument
# footgun this rule exists to catch.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic's own --autogenerate template predates modern typing/import-sort
# conventions; not worth hand-fixing on every migration, and not worth
# customizing script.py.mako just to appease the linter.
"app/alembic/versions/*.py" = ["UP035", "UP007", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
