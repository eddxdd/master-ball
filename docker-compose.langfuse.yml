# Optional Langfuse stack for a first-hand LangSmith-vs-Langfuse comparison.
# Usage (alongside the main stack):
#   docker compose -f docker-compose.yml -f docker-compose.langfuse.yml --profile observability up -d
#
# Then set in root .env:
#   LANGFUSE_PUBLIC_KEY=...   # from http://localhost:3100
#   LANGFUSE_SECRET_KEY=...
#   LANGFUSE_HOST=http://langfuse-web:3000
#
# UI: http://localhost:3100

services:
  langfuse-db:
    profiles: ["observability"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-web:
    profiles: ["observability"]
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-masterball-langfuse-dev-secret}
      SALT: ${LANGFUSE_SALT:-masterball-langfuse-salt}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

volumes:
  langfuse_pg_data:
