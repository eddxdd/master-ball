name: dextrainer

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dextrainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dextrainer}
      POSTGRES_DB: ${POSTGRES_DB:-dextrainer}
    ports:
      # Host-side port intentionally not 5432: a native Postgres install on the
      # host is a common source of a silent port conflict (connections get
      # accepted by the wrong Postgres with different credentials, which looks
      # like a password error, not a connection error). Container-to-container
      # traffic (backend -> postgres) is unaffected, since that uses the
      # Docker-internal port 5432 regardless of this mapping. See setup.md.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dextrainer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Final image doesn't carry the `uv` binary (only the venv it built) — see
    # Backend/Dockerfile. `uvicorn` resolves straight from PATH (/app/.venv/bin).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_NAME: ${APP_NAME:-DexTrAIner}
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dextrainer}:${POSTGRES_PASSWORD:-dextrainer}@postgres:5432/${POSTGRES_DB:-dextrainer}
      VALKEY_URL: redis://valkey:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_APP_NAME: ${APP_NAME:-DexTrAIner}
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  valkey_data:
  backend_venv:
  frontend_node_modules:
